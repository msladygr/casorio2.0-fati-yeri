<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fati & Yeri • 03.04.2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; overflow-x: hidden; width: 100%;
            background-color: #121614; font-family: 'Plus Jakarta Sans', sans-serif; color: #f4f1ea;
        }
        h1, h2, h3, .font-editorial { font-family: 'Playfair Display', serif; }

        /* --- HOJAS OTOÑALES FLOTANTES --- */
        .falling-leaves {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 120; overflow: hidden;
        }
        .leaf {
            position: absolute; display: block; width: 18px; height: 18px;
            background: #b89b72; opacity: 0.4; animation: fall linear infinite; border-radius: 0 70% 0 70%;
        }
        .leaf:nth-child(2n) { background: #946853; border-radius: 70% 0 70% 0; }
        .leaf:nth-child(3n) { background: #7a8670; }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateX(40px) rotate(180deg); }
            100% { top: 110%; transform: translateX(-30px) rotate(360deg); opacity: 0.1; }
        }

        /* --- CONTENEDOR GENERAL DEL SOBRE --- */
        #envelope-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1c2420 0%, #0a0e0c 100%);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s ease;
        }
        #envelope-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Sobre artesanal con perspectiva 3D */
        .luxury-envelope {
            position: relative;
            width: 360px;
            height: 245px;
            background: linear-gradient(135deg, #fbf9f5 0%, #f0ebd9 100%);
            border-radius: 6px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7), 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            perspective: 1400px;
        }

        /* Simulación de textura de encaje láser en los bordes de la solapa[cite: 3] */
        .lace-pattern {
            background-image: radial-gradient(circle, #e2dac9 1px, transparent 1px);
            background-size: 8px 8px;
            opacity: 0.6;
        }

        /* Tarjeta interior (opalina con bordes dorados sutiles) */
        .inner-card {
            position: absolute;
            bottom: 12px;
            left: 5%;
            width: 90%;
            height: 210px;
            background: #ffffff;
            border: 1px solid #d4c5a9;
            border-radius: 4px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }
        .luxury-envelope.open .inner-card {
            transform: translateY(-130px) scale(1.03);
            z-index: 10;
        }

        /* Bolsillo frontal del sobre */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #f5f0e1 0%, #e6dcc5 100%);
            border-radius: 6px;
            z-index: 5;
            box-shadow: inset 0 -8px 20px rgba(0,0,0,0.06);
            pointer-events: none;
        }

        /* Solapa superior con diseño de encaje y apertura 3D[cite: 3, 4] */
        .envelope-top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 125px;
            background: linear-gradient(135deg, #ffffff 0%, #eee6d2 100%);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-bottom: 1px solid rgba(184, 155, 114, 0.3);
        }
        .luxury-envelope.open .envelope-top-flap {
            transform: rotateX(-180deg);
            z-index: 1;
        }

        /* Sello Dorado en Relieve de Alta Gama[cite: 3, 4] */
        .gold-seal {
            position: absolute;
            top: 108px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 30% 30%, #fceabb 0%, #e6be4ae5 55%, #9e7b12 100%);
            border-radius: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #7d600e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.7);
            transition: transform 0.4s ease, opacity 0.5s ease;
        }
        .gold-seal span {
            font-family: 'Playfair Display', serif;
            color: #4a3809;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 1px 1px rgba(255,255,255,0.5);
            pointer-events: none;
        }
        .luxury-envelope.open .gold-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.4) rotate(45deg);
            pointer-events: none;
        }

        #main-content {
            opacity: 0; transform: translateY(20px);
            transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
        }
        #main-content.revealed { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <div class="falling-leaves">
        <span class="leaf" style="left: 10%; animation-duration: 14s; animation-delay: 0s;"></span>
        <span class="leaf" style="left: 30%; animation-duration: 18s; animation-delay: 2s;"></span>
        <span class="leaf" style="left: 50%; animation-duration: 12s; animation-delay: 1s;"></span>
        <span class="leaf" style="left: 70%; animation-duration: 16s; animation-delay: 3s;"></span>
        <span class="leaf" style="left: 90%; animation-duration: 13s; animation-delay: 1.5s;"></span>
    </div>

    <!-- SOBRE DE LUJO ARTESANAL (FASE 1) -->
    <div id="envelope-overlay">
        <p class="text-[10px] uppercase tracking-[0.35em] text-[#c4b59d] mb-6 font-semibold animate-pulse">Toca el sello dorado para abrir[cite: 3, 4]</p>
        
        <div class="luxury-envelope" id="envBox" onclick="openArtisanEnvelope()">
            <!-- Tarjeta Interior -->
            <div class="inner-card">
                <span class="text-[9px] uppercase tracking-[0.3em] text-[#b89b72] font-bold mb-2">Save The Date</span>
                <h2 class="font-editorial text-2xl text-[#121614] mb-1">Fati &amp; Yeri</h2>
                <p class="text-[11px] text-gray-500 italic font-serif">03.04.2027</p>
            </div>

            <!-- Bolsillo del Sobre -->
            <div class="envelope-pocket"></div>

            <!-- Solapa Superior con detalle de encaje simulado[cite: 3] -->
            <div class="envelope-top-flap lace-pattern"></div>

            <!-- Sello Dorado[cite: 3, 4] -->
            <div class="gold-seal">
                <span>F&Y</span>
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main-content" class="w-full flex flex-col items-center justify-start min-h-screen">
        <section class="min-h-screen w-full flex flex-col justify-between items-center p-6 sm:p-12 relative text-center border-b border-white/10">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(41,48,43,0.4)_0%,rgba(18,22,20,1)_100%)] pointer-events-none"></div>
            <div class="relative z-10 pt-8">
                <span class="inline-block bg-white/5 text-[#c4b59d] text-xs font-semibold px-6 py-2 rounded-full uppercase tracking-[0.25em] border border-white/10 backdrop-blur-md">
                    03.04.2027 • Boda Editorial
                </span>
            </div>
            <div class="relative z-10 my-auto py-12">
                <h1 class="text-7xl sm:text-9xl font-editorial font-normal tracking-tight mb-6 text-[#fcfbfa] drop-shadow-lg">
                    Fati <span class="text-[#c4b59d] italic">&amp;</span> Yeri
                </h1>
                <p class="text-lg sm:text-2xl text-white/70 italic max-w-xl mx-auto font-light tracking-wide">
                    "Decidimos arruinar nuestras finanzas y festejar a lo grande"
                </p>
            </div>
            <div class="relative z-10 w-full max-w-md mx-auto pb-6">
                <div class="grid grid-cols-4 gap-3 bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 text-center shadow-2xl">
                    <div><span id="days" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span><span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Días</span></div>
                    <div><span id="hours" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span><span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Horas</span></div>
                    <div><span id="minutes" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span><span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Min</span></div>
                    <div><span id="seconds" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span><span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Seg</span></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function openArtisanEnvelope() {
            const box = document.getElementById('envBox');
            const overlay = document.getElementById('envelope-overlay');
            const mainContent = document.getElementById('main-content');

            box.classList.add('open');
            setTimeout(() => {
                overlay.classList.add('fade-out');
                mainContent.classList.add('revealed');
            }, 1100);
            setTimeout(() => { overlay.remove(); }, 2300);
        }

        const weddingDate = new Date('Apr 3, 2027 16:00:00').getTime();
        function updateCountdown() {
            const now = new Date().getTime(), distance = weddingDate - now;
            if (distance > 0) {
                document.getElementById('days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById('hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('minutes').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('seconds').innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }
        }
        setInterval(updateCountdown, 1000); updateCountdown();
    </script>
</body>
</html>

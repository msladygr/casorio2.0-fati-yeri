<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fati & Yeri • 03.04.2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #121614;
            color: #f4f1ea;
            overflow-x: hidden;
            margin: 0;
        }
        h1, h2, h3, .font-editorial {
            font-family: 'Playfair Display', serif;
        }

        /* Hojas otoñales de fondo */
        .falling-leaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .leaf {
            position: absolute;
            display: block;
            width: 18px;
            height: 18px;
            background: #b89b72;
            opacity: 0.35;
            animation: fall linear infinite;
            border-radius: 0 70% 0 70%;
        }
        .leaf:nth-child(2n) {
            background: #946853;
            border-radius: 70% 0 70% 0;
        }
        .leaf:nth-child(3n) {
            background: #7a8670;
        }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateX(50px) rotate(180deg); }
            100% { top: 110%; transform: translateX(-30px) rotate(360deg); opacity: 0.05; }
        }

        /* --- SOBRE REAL INTERACTIVO (FASE 1) --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: #121614;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease 0.5s, visibility 0.8s ease 0.5s;
        }
        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .envelope-wrapper {
            width: 85%;
            max-width: 380px;
            height: 250px;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        /* Cuerpo del sobre */
        .envelope {
            position: absolute;
            inset: 0;
            background: #1a221e;
            border: 1px solid rgba(184, 155, 114, 0.3);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 2;
        }

        /* Solapa superior del sobre */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 125px;
            background: #161c18;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
            border-bottom: 1px solid rgba(184, 155, 114, 0.2);
        }
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        /* La tarjeta / invitación que sale del sobre */
        .invite-card {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 210px;
            background: #fcfbfa;
            color: #121614;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 3;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
        }
        .envelope-wrapper.open .invite-card {
            transform: translateY(-130px) scale(1.05);
            z-index: 5;
        }

        /* Sello de Lacre Fino */
        .wax-seal {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: #8c3b32;
            border: 2px solid #5c241f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }
        .envelope-wrapper:hover .wax-seal {
            transform: translateX(-50%) scale(1.1);
        }
        .wax-seal span {
            font-family: 'Playfair Display', serif;
            color: #f4f1ea;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="selection:bg-[#b89b72] selection:text-white">

    <!-- Capa de Hojas de Otoño -->
    <div class="falling-leaves">
        <span class="leaf" style="left: 10%; animation-duration: 12s; animation-delay: 0s;"></span>
        <span class="leaf" style="left: 30%; animation-duration: 16s; animation-delay: 2s;"></span>
        <span class="leaf" style="left: 50%; animation-duration: 10s; animation-delay: 1s;"></span>
        <span class="leaf" style="left: 70%; animation-duration: 14s; animation-delay: 3s;"></span>
        <span class="leaf" style="left: 90%; animation-duration: 11s; animation-delay: 1.5s;"></span>
    </div>

    <!-- PANTALLA DE APERTURA: SOBRE REAL INTERACTIVO (FASE 1) -->
    <div id="intro-overlay">
        <div class="text-center px-4 w-full flex flex-col items-center">
            <p class="text-[10px] uppercase tracking-[0.3em] text-[#c4b59d] mb-8 font-semibold animate-pulse">Toca el sello para abrir</p>
            
            <!-- Contenedor del Sobre -->
            <div class="envelope-wrapper" onclick="openRealEnvelope()">
                <div class="envelope"></div>
                <div class="envelope-flap"></div>
                
                <!-- Tarjeta oculta dentro del sobre -->
                <div class="invite-card">
                    <span class="text-[9px] uppercase tracking-[0.2em] text-[#8c3b32] font-bold mb-1">Boda Fati &amp; Yeri</span>
                    <p class="font-editorial text-2xl text-[#121614] mb-1">03.04.2027</p>
                    <p class="text-[10px] text-gray-600 italic">Entrando a la experiencia...</p>
                </div>

                <!-- Sello de Lacre -->
                <div class="wax-seal">
                    <span>F&Y</span>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DE LA WEB (FASE 1 - HERO) -->
    <main class="w-full flex flex-col items-center justify-start">
        
        <!-- HERO SECTION -->
        <section class="min-h-screen w-full flex flex-col justify-between items-center p-6 sm:p-12 relative text-center border-b border-white/10">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(41,48,43,0.4)_0%,rgba(18,22,20,1)_100%)] pointer-events-none"></div>

            <div class="relative z-10 pt-8">
                <span class="inline-block bg-white/5 text-[#c4b59d] text-xs font-semibold px-6 py-2 rounded-full uppercase tracking-[0.25em] border border-white/10 backdrop-blur-md">
                    03.04.2027 • Boda Editorial
                </span>
            </div>

            <div class="relative z-10 my-auto py-12">
                <h1 class="text-7xl sm:text-9xl font-editorial font-normal tracking-tight mb-6 text-[#fcfbfa] drop-shadow-lg">
                    Fati <span class="text-[#c4b59d] italic">&amp;</span> Yeri
                </h1>
                <p class="text-lg sm:text-2xl text-white/70 italic max-w-xl mx-auto font-light tracking-wide">
                    "Decidimos arruinar nuestras finanzas y festejar a lo grande"
                </p>
            </div>

            <!-- Cuenta Regresiva -->
            <div class="relative z-10 w-full max-w-md mx-auto pb-6">
                <div class="grid grid-cols-4 gap-3 bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 text-center shadow-2xl">
                    <div>
                        <span id="days" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span>
                        <span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Días</span>
                    </div>
                    <div>
                        <span id="hours" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span>
                        <span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Horas</span>
                    </div>
                    <div>
                        <span id="minutes" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span>
                        <span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Min</span>
                    </div>
                    <div>
                        <span id="seconds" class="block text-2xl font-editorial font-bold text-[#e2d9c8]">00</span>
                        <span class="text-[9px] uppercase tracking-[0.25em] text-white/50">Seg</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Script de la Fase 1 (Sobre Real) -->
    <script>
        function openRealEnvelope() {
            const wrapper = document.querySelector('.envelope-wrapper');
            const overlay = document.getElementById('intro-overlay');

            // Activa la animación CSS del sobre (abre solapa y desliza tarjeta)
            wrapper.classList.add('open');

            // Desvanece el fondo oscuro y libera la web principal
            setTimeout(() => {
                overlay.classList.add('fade-out');
            }, 1000);
        }

        // Cuenta Regresiva
        const weddingDate = new Date('Apr 3, 2027 16:00:00').getTime();
        function updateCountdown() {
            const now = new Date().getTime(), distance = weddingDate - now;
            if (distance > 0) {
                document.getElementById('days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById('hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('minutes').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('seconds').innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fati & Yeri • 03.04.2027 (Intro)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh;
            background-color: #f8f5ee;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- TELÓN CON LUCES Y SOMBRAS VOLUMÉTRICAS REALISTAS --- */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; transition: visibility 1.5s ease;
        }
        #intro-overlay.hidden-intro {
            visibility: hidden; pointer-events: none;
        }

        /* Mitades del telón con gradientes de luz lateral y sombras de pliegue profundo */
        .curtain-left, .curtain-right {
            position: absolute; top: 0; width: 50%; height: 100%;
            background-color: #f3eee3;
            z-index: 210;
            transition: transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .curtain-left { 
            left: 0; 
            background-image: linear-gradient(90deg, #ede7db 0%, #f4f0e6 65%, #dfd4c0 92%, #c9bc9f 100%);
            box-shadow: inset -50px 0 80px rgba(0,0,0,0.14);
        }
        
        .curtain-right { 
            right: 0; 
            background-image: linear-gradient(270deg, #ede7db 0%, #f4f0e6 65%, #dfd4c0 92%, #c9bc9f 100%);
            box-shadow: inset 50px 0 80px rgba(0,0,0,0.14);
        }

        /* Apertura fluida hacia los costados */
        #intro-overlay.open .curtain-left {
            transform: translateX(-100%);
        }
        #intro-overlay.open .curtain-right {
            transform: translateX(100%);
        }

        /* Contenido Central del Telón */
        .intro-content {
            position: relative; z-index: 220; text-align: center; padding: 0 20px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #intro-overlay.open .intro-content {
            opacity: 0; transform: scale(0.97); pointer-events: none;
        }

        /* Contenedor de las Alianzas Reales con Animación 3D y sin fondo */
        .rings-wrapper {
            margin: 0 auto 32px auto;
            display: inline-block;
            animation: ringFloatAndRotate 6s ease-in-out infinite;
            transform-style: preserve-3d;
            filter: drop-shadow(0 18px 25px rgba(110, 85, 30, 0.4));
        }

        .real-rings-img {
            width: 140px; /* Tamaño protagonista y de alta definición */
            height: auto;
            object-fit: contain;
            /* Mezclamos el modo de fusión para eliminar cualquier rastro blanco de fondo de forma limpia */
            mix-blend-mode: multiply; 
        }

        @keyframes ringFloatAndRotate {
            0% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-8px) rotateY(15deg); }
            100% { transform: translateY(0px) rotateY(0deg); }
        }

        /* Botón Editorial Cálido */
        .editorial-btn {
            display: inline-block;
            background: rgba(248, 245, 238, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(44, 53, 49, 0.2);
            color: #2c3531;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .editorial-btn:hover {
            border-color: #8c7355;
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE ENTRADA: FASE 1 (TELÓN REAL Y TU IMAGEN DE ALIANZAS SIN FONDO) -->
    <div id="intro-overlay">
        <div class="curtain-left"></div>
        <div class="curtain-right"></div>
        
        <div class="intro-content">
            <!-- Imagen real de alianzas integrada y limpia de fondo -->
            <div class="rings-wrapper">
                <img src="https://images.unsplash.com/photo-1603561591411-07134e71a2a9?q=80&w=400&auto=format&fit=crop" alt="Alianzas Entrelazadas Fati y Yeri" class="real-rings-img">
            </div>
            
            <br>
            
            <button onclick="openVelvetCurtain()" class="editorial-btn">
                Ingresar a la experiencia ✨
            </button>
        </div>
    </div>

    <script>
        function openVelvetCurtain() {
            const overlay = document.getElementById('intro-overlay');
            overlay.classList.add('open');
            setTimeout(() => { overlay.remove(); }, 1800);
        }
    </script>
</body>
</html>
